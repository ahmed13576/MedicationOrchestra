name: medication_orchestra
description: "Household medication safety agent — powered by Gemini 2.5 Flash"
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.2
  # Required by zonedSchedule: reminders are pinned to the device's wall clock,
  # so a dose at 08:00 stays at 08:00 across timezone and DST changes.
  timezone: ^0.10.0
  flutter_timezone: ^5.0.0
  # Camera
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  # HTTP
  dio: ^5.7.0
  # UI
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
